# Optional R environment for the slingshot preprocessing step
# (`scripts/compute_pseudotime.py --method slingshot`, which calls
#  `scripts/compute_pseudotime.R`). This is the method used to build the
# released `pseudotime.csv` files.
#
# Create with:
#     conda env create --solver=libmamba -f environment_pseudotime.yml
#     conda activate FateDriver-pseudotime
#
# Notes
# -----
# * Keep this env separate from `FateDriver`: only `Rscript` has to be on PATH
#   when `compute_pseudotime.py --method slingshot` runs, so a practical setup is
#       conda activate FateDriver-pseudotime   # provides Rscript
#       python scripts/compute_pseudotime.py ... --rscript $(which Rscript)
#   or simply pass `--rscript /path/to/envs/FateDriver-pseudotime/bin/Rscript`
#   from the FateDriver env.
# * slingshot 2.18.0 (Bioconductor 3.22) is the latest bioconda build and
#   requires R 4.5. `bioconductor-delayedmatrixstats` is listed explicitly
#   because the bioconda slingshot package does not pull it in, and slingshot
#   fails at run time without it.
# * You do not need this environment if you use the released datasets or the
#   pure-Python `--method dpt`.
name: FateDriver-pseudotime
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5
  - r-matrix
  - r-igraph
  - r-ggplot2
  - r-dplyr
  - bioconductor-slingshot=2.18.0
  - bioconductor-delayedmatrixstats
